
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arfanity Core Orchestrator v2.7 | Multi-Agent AI Framework</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
      
      /* Status Animations */
      @keyframes pulse-ring {
        0% { transform: scale(.8); opacity: 0.5; }
        100% { transform: scale(1.4); opacity: 0; }
      }
      
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-6px); }
        80% { transform: translateX(6px); }
      }
      
      @keyframes glow-blue {
        0%, 100% { box-shadow: 0 0 5px rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.4); }
        50% { box-shadow: 0 0 25px rgba(59, 130, 246, 0.5); border-color: rgba(59, 130, 246, 0.8); }
      }

      @keyframes slide-in-bottom {
        from { transform: translateY(12px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      @keyframes zoom-in-bounce {
        0% { transform: scale(0.9); opacity: 0; }
        70% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes reveal-up {
        from { clip-path: inset(100% 0 0 0); transform: translateY(20px); opacity: 0; }
        to { clip-path: inset(0 0 0 0); transform: translateY(0); opacity: 1; }
      }

      .animate-shake {
        animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
      }
      
      .working-pulse {
        animation: pulse-subtle 2s infinite ease-in-out, glow-blue 2s infinite ease-in-out;
      }
      
      .pulse-ring-effect::after {
        content: '';
        position: absolute;
        inset: -6px;
        border: 2px solid #3b82f6;
        border-radius: inherit;
        animation: pulse-ring 1.5s infinite;
      }

      .animate-reveal {
        animation: reveal-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Premium Typography Rendering */
      .delivery-content h3 {
        font-weight: 800;
        font-size: 1.1rem;
        color: #1e3a8a;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
        letter-spacing: -0.01em;
      }
      .delivery-content p {
        margin-bottom: 1rem;
        line-height: 1.7;
      }
      .delivery-content strong {
        font-weight: 700;
        color: #111827;
      }
      .delivery-content ul {
        list-style-type: none;
        padding-left: 0;
        margin-bottom: 1.5rem;
      }
      .delivery-content li {
        position: relative;
        padding-left: 1.5rem;
        margin-bottom: 0.5rem;
      }
      .delivery-content li::before {
        content: "•";
        position: absolute;
        left: 0;
        color: #3b82f6;
        font-weight: bold;
      }

      /* Custom scrollbar for enterprise look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
      }
    </style>
